# Render Blueprint — 틈봄 API (FastAPI). Free plan: sleeps after 15 min idle, ~30–60 s cold start.
services:
  - type: web
    name: teumbom-api
    runtime: python
    plan: free
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: JWT_SECRET
        generateValue: true
      # Allow the Vercel production + preview domains
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: CORS_ORIGINS
        value: http://localhost:3000
      # rules = demo mode (no API key needed). Set to "claude" and add ANTHROPIC_API_KEY to use Claude.
      - key: TEUMBOM_AI
        value: rules
      # Optional: DATABASE_URL (Render/Neon Postgres). Without it the demo uses SQLite and resets on restart.
      # Optional: TURN_URL, TURN_USERNAME, TURN_CREDENTIAL for WebRTC over strict mobile networks.
